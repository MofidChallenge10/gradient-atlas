<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gradient Atlas</title><style>:root{font-family:system-ui,sans-serif;background:#111723;color:#f1f4f8}*{box-sizing:border-box}body{margin:0}.mast{padding:22px 5vw;border-bottom:1px solid #364151;display:flex;justify-content:space-between;color:#aebbd0;font-size:12px;letter-spacing:.16em}.shell{max-width:1100px;margin:auto;padding:58px 24px}.headline{display:flex;justify-content:space-between;gap:30px;align-items:end}.headline h1{font-size:clamp(3rem,8vw,6rem);line-height:.9;letter-spacing:-.08em;margin:0}.headline p{max-width:290px;color:#9aa8bc;line-height:1.6}.stage{height:280px;margin:38px 0;border:1px solid #566174;background:linear-gradient(110deg,#e46f54 0%,#e9cf76 50%,#4a9a98 100%);position:relative}.stage:after{content:"LIVE GRADIENT";position:absolute;bottom:18px;left:20px;color:white;font-size:11px;letter-spacing:.18em;text-shadow:0 1px 8px #000}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}.control{padding:18px;background:#1b2636;border-top:2px solid #647b98}.control label{display:block;color:#aebbd0;font-size:12px;margin-bottom:10px}.control input{width:100%;padding:8px;border:1px solid #526176;background:#0e1520;color:white;font:inherit}.output{margin-top:18px;padding:18px;background:#0a1019;color:#d6e3f5;display:flex;gap:15px;align-items:center}.output code{flex:1;overflow-wrap:anywhere}.output button{border:0;padding:11px 16px;background:#e7c56e;color:#1c2431;font-weight:800;cursor:pointer}@media(max-width:700px){.headline{display:block}.controls{grid-template-columns:1fr 1fr}.stage{height:220px}}@media(max-width:420px){.controls{grid-template-columns:1fr}}</style></head><body><header class="mast"><span>COLOR STUDIES / 02</span><span>GRADIENT ATLAS</span></header><main class="shell"><section class="headline"><h1>Find the<br>in-between.</h1><p>Three stops, one direction. Shape a gradient that feels intentional, then take the CSS with you.</p></section><div id="stage" class="stage" role="img" aria-label="Live gradient preview"></div><section class="controls"><div class="control"><label for="angle">ANGLE · DEGREES</label><input id="angle" type="number" min="0" max="360" value="110"></div><div class="control"><label for="c1">START COLOR</label><input id="c1" type="color" value="#e46f54"></div><div class="control"><label for="c2">MIDDLE COLOR</label><input id="c2" type="color" value="#e9cf76"></div><div class="control"><label for="c3">END COLOR</label><input id="c3" type="color" value="#4a9a98"></div></section><div class="output"><code id="css" aria-live="polite"></code><button id="copy">Copy CSS</button></div></main><script type="module" src="app.mjs"></script></body></html>
